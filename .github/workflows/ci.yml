name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test-macos:
    name: Build, Test & Verify Package (macOS Apple Silicon)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install llvm glfw freetype tree-sitter cmake ninja

      - name: Configure CMake (Ninja)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_OBJCXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build SCOPE, fixtures & test suites
        run: cmake --build build

      - name: Run Unit Tests (CTest)
        run: ctest --test-dir build --output-on-failure -R "^scope_unit_tests$"

      - name: Run End-to-End liblldb Engine Integration Tests
        run: |
          sudo DevToolsSecurity -enable || true
          ctest --test-dir build --output-on-failure -R "^scope_engine_test$"

      - name: Package & Verify macOS SCOPE.app Bundle
        run: |
          chmod +x scripts/package_macos.sh scripts/verify_package.sh
          ./scripts/package_macos.sh "ci-${GITHUB_SHA::7}" build dist
          ./scripts/verify_package.sh dist
