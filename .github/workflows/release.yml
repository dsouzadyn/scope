name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release-macos:
    name: Build, Test & Publish macOS Release (arm64)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install llvm glfw freetype tree-sitter cmake ninja

      - name: Configure CMake (Release)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_OBJCXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build SCOPE, fixtures & test suites
        run: cmake --build build

      - name: Gate 1 — Run Unit Tests
        run: ctest --test-dir build --output-on-failure -R "^scope_unit_tests$"

      - name: Gate 2 — Run End-to-End liblldb Engine Integration Tests
        run: |
          sudo DevToolsSecurity -enable || true
          ctest --test-dir build --output-on-failure -R "^scope_engine_test$"

      - name: Gate 3 — Enforce Multi-Metric LLVM Code Coverage Thresholds
        run: |
          cmake -S . -B build-cov -G Ninja \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_OBJCXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSCOPE_ENABLE_COVERAGE=ON
          cmake --build build-cov --target scope_unit_tests scope_engine_test fixture_step_basics fixture_stl_containers fixture_memory_watch fixture_multithread fixture_crash_autopsy fixture_hft_orderbook
          chmod +x scripts/coverage.sh
          ./scripts/coverage.sh build-cov coverage

      - name: Gate 4 — Package & Verify SCOPE.app Integrity
        run: |
          chmod +x scripts/package_macos.sh scripts/verify_package.sh
          ./scripts/package_macos.sh "${{ steps.meta.outputs.tag }}" build dist
          ./scripts/verify_package.sh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "SCOPE ${{ steps.meta.outputs.tag }} (macOS Apple Silicon)"
          generate_release_notes: true
          body: |
            ## SCOPE ${{ steps.meta.outputs.tag }} — macOS Apple Silicon (Metal)

            ### Runtime Prerequisite
            `SCOPE.app` bundles GLFW, FreeType, libpng, and Tree-sitter internally, and links against Homebrew LLVM (`liblldb`) for native debugging & `debugserver`:

            ```bash
            brew install llvm
            ```

            ### Install
            1. Download `SCOPE-${{ steps.meta.outputs.tag }}-macos-arm64.zip` (or `.tar.gz`) and extract `SCOPE.app`.
            2. Because the app is ad-hoc signed, remove quarantine on first run if prompted:
               ```bash
               xattr -dr com.apple.quarantine SCOPE.app
               ```
            3. Launch `SCOPE.app` or run from terminal with a target binary:
               ```bash
               ./SCOPE.app/Contents/MacOS/scope /path/to/your_cpp_binary
               ```
          files: |
            dist/SCOPE-*-macos-*.zip
            dist/scope-*-macos-*.tar.gz
            dist/SHA256SUMS.txt
